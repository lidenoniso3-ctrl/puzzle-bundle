<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape Sudoku</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --panel-alt: #1e222b;
      --accent: #7c5cff; --accent-hover: #6a4ae0;
      --text: #e8e8ea; --muted: #9aa0a6; --border: #2a2f3a;
      --success: #2ecc71; --error: #ff5252;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", sans-serif; background: var(--bg);
      color: var(--text); padding: 24px; min-height: 100vh;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 22px; }
    .header a { color: var(--muted); text-decoration: none; font-size: 14px; }
    .header a:hover { color: var(--accent); }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 12px; color: var(--muted);
      margin-bottom: 6px; font-weight: 600;
    }
    .form-group select, .form-group input {
      width: 100%; padding: 10px 12px; background: var(--panel-alt);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 13px; font-family: inherit;
    }
    .form-group select:focus, .form-group input:focus {
      outline: none; border-color: var(--accent);
    }
    .radio-group { display: flex; gap: 16px; flex-wrap: wrap; }
    .radio-group label {
      display: flex; align-items: center; gap: 6px;
      cursor: pointer; font-size: 13px;
    }
    .radio-group input { width: auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      width: 100%; padding: 14px; background: var(--accent);
      color: white; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover:not(:disabled) { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 14px; border-radius: 8px;
      text-align: center; min-height: 50px;
      background: var(--panel-alt); font-size: 14px;
    }
    .status.success { background: rgba(46,204,113,0.15); color: var(--success); }
    .status.error { background: rgba(255,82,82,0.15); color: var(--error); }
    .status.info { background: rgba(124,92,255,0.15); color: var(--accent); }
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid var(--accent); border-top-color: transparent;
      border-radius: 50%; animation: spin 0.8s linear infinite;
      vertical-align: middle; margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note {
      font-size: 12px; color: var(--muted);
      margin-top: 12px; text-align: center; line-height: 1.6;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🔺 Shape Sudoku</h1>
    <a href="../index.html">← Back to Dashboard</a>
  </div>

  <div class="panel">
    <div class="form-group">
      <label>Sudoku Variant</label>
      <select id="variant">
        <option value="shapes4" selected>Shape Sudoku 4×4</option>
        <option value="kids4">Mini Kids 4×4</option>
        <option value="kids6">Kids 6×6</option>
        <option value="standard">Standard 9×9</option>
        <option value="diagonal">Diagonal (X-Sudoku)</option>
        <option value="letters">Letter Sudoku</option>
        <option value="windoku">Windoku 9×9</option>
      </select>
    </div>

    <div class="form-group">
      <label>Difficulty</label>
      <div class="radio-group">
        <label><input type="radio" name="difficulty" value="Gentle"> Easy</label>
        <label><input type="radio" name="difficulty" value="Standard" checked> Medium</label>
        <label><input type="radio" name="difficulty" value="Fiendish"> Hard</label>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Number of Puzzles</label>
        <input type="number" id="count" value="12" min="1" max="200">
      </div>
      <div class="form-group">
        <label>Puzzles per Page</label>
        <select id="ppp">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="6" selected>6</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Seed (Optional)</label>
      <input type="text" id="seed" placeholder="Leave blank for new puzzles">
    </div>

    <div class="form-group">
      <label>Book Title</label>
      <input type="text" id="title" value="The Ultimate Sudoku Book">
    </div>

    <div class="form-group">
      <label>Author Name</label>
      <input type="text" id="author" value="Abdessamad Najmi">
    </div>

    <button class="btn" id="btn-generate">📥 Generate & Download PDF</button>
    <div class="status" id="status">Ready</div>

    <p class="note">
      ⚠️ Generation happens server-side — may take 5-30 seconds.<br>
      4×4: Instant • 9×9: Max 20 puzzles.
    </p>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const btn = $("btn-generate");

  function setStatus(html, type) {
    statusEl.className = "status " + (type || "");
    statusEl.innerHTML = html;
  }

  async function generate() {
    const licenseKey = localStorage.getItem("puzzle_license_key");
    if (!licenseKey) {
      location.href = "../index.html";
      return;
    }

    const options = {
      licenseKey,
      variant: $("variant").value,
      difficulty: document.querySelector('input[name="difficulty"]:checked').value,
      count: parseInt($("count").value, 10) || 12,
      ppp: parseInt($("ppp").value, 10) || 6,
      seed: $("seed").value.trim(),
      title: $("title").value,
      author: $("author").value,
      bookSize: "8.5 x 11 inches",
    };

    btn.disabled = true;
    setStatus('⏳ Generating on server... <span class="spinner"></span>', "info");

    try {
      const response = await fetch("/.netlify/functions/generate-sudoku", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(options),
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        const messages = {
          invalid_key: "Invalid license key.",
          refunded: "This purchase has been refunded.",
          unauthorized: "Unauthorized — please log in again.",
          generation_failed: "Server generation failed.",
        };
        throw new Error(messages[err.error] || err.error || "Unknown error");
      }

      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `sudoku-${options.variant}-${options.seed || "auto"}.pdf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      setStatus("✅ PDF generated and downloaded successfully.", "success");
    } catch (err) {
      console.error(err);
      setStatus("❌ " + err.message, "error");
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", generate);
})();
</script>
</body>
</html>
